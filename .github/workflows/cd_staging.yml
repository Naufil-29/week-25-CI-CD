name: Deploy to staging
on:
  push:
    branches: [ main ]

jobs:
  redeploy_everything:
    runs-on: ubuntu-latest
    name: Deploying everything to the staging cluster
    steps:
      - run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
          mkdir -p /home/runner/.ssh
          ls /home/runner/.ssh
          touch /home/runner/.ssh/known_hosts
          ssh-keyscan -H 16.16.213.236 >> /home/runner/.ssh/known_hosts
          chmod 700 /home/runner/ssh_key
          ssh -i ~/ssh_key ubuntu@16.16.213.236 -t "cd week-25-CI-CD/ &&cd week-25-ci-next-app/ && git pull origin main && export PATH=\$HOME/.nvm/versions/node/v24.15.0/bin:\$PATH && npm install -g pnpm && pnpm install && pnpm run build && pm2 restart web && pm2 restart http-server && pm2 restart ws-server"

